services:
  web:
    image: odoo:17.0
    command: odoo --log-level=debug
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ../digitux_purchase:/mnt/extra-addons/digitux_purchase
      - ../digitux_inventario:/mnt/extra-addons/digitux_inventario

    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
   